name: Bitácora en el README

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bitacora:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: gautamkrishnar/blog-post-workflow@459e78d2225e6b53fa6801528c5e644059c03514
        with:
          feed_list: "https://jdsantana.com/bitacora/rss.xml"
          max_post_count: 3
          template: "- $date: [$title]($url)$newline"
          date_format: "UTC:dd/mm/yyyy"
          tag_post_pre_newline: true
          commit_message: "Actualizadas las últimas entradas de la bitácora"
          committer_username: "github-actions[bot]"
          committer_email: "41898282+github-actions[bot]@users.noreply.github.com"
          enable_keepalive: false
