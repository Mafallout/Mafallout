# Cada [[proyecto]] es una fila de la tarjeta "En qué estoy", en este orden.
# estado: "funciona" (punto verde que late) o "en-construccion" (aro ámbar).
# texto: lo que se lee a la derecha de la fila.
# repo: debajo sale la fecha de su último cambio. Si el repo es privado, no sale.
# rss: debajo sale la fecha de la última entrada.

[[proyecto]]
